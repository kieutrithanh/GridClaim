name: Gemini CLI Assistant

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Run Gemini CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          npx @google/gemini-cli --skip-trust "Hãy phân tích dự án này và trả lời issue"
